<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <rect width="1200" height="800" fill="#F8F8FC"/>
  <!-- Topographic survey grid -->
  <g stroke="#E2E0EC" stroke-width="1.5">
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
    <line x1="240" y1="0" x2="240" y2="800"/>
    <line x1="480" y1="0" x2="480" y2="800"/>
    <line x1="720" y1="0" x2="720" y2="800"/>
    <line x1="960" y1="0" x2="960" y2="800"/>
  </g>
  <!-- Contour rings -->
  <path d="M120 680 Q460 540 840 610 T1150 510" stroke="#C5B9DF" stroke-width="2" fill="none"/>
  <path d="M80 540 Q430 400 810 470 T1160 360" stroke="#C5B9DF" stroke-width="2" fill="none"/>
  <path d="M100 360 Q480 220 840 290 T1140 190" stroke="#C5B9DF" stroke-width="2" fill="none"/>
  <!-- Access road corridor -->
  <path d="M140 800 L310 0 L410 0 L240 800 Z" fill="#E3E3ED"/>
  <path d="M190 800 L360 0" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14 14"/>
  <!-- Lot polygon -->
  <polygon points="390,190 890,170 960,570 315,610" fill="#6500B5" fill-opacity="0.10" stroke="#6500B5" stroke-width="4"/>
  <circle cx="390" cy="190" r="9" fill="#FFFFFF" stroke="#10169C" stroke-width="4"/>
  <circle cx="890" cy="170" r="9" fill="#FFFFFF" stroke="#10169C" stroke-width="4"/>
  <circle cx="960" cy="570" r="9" fill="#FFFFFF" stroke="#10169C" stroke-width="4"/>
  <circle cx="315" cy="610" r="9" fill="#FFFFFF" stroke="#10169C" stroke-width="4"/>
  <!-- Compass rose -->
  <g transform="translate(1065 115)">
    <circle r="38" fill="#FFFFFF" stroke="#D6D6E4" stroke-width="2"/>
    <path d="M0 -24 L7 0 L0 24 L-7 0 Z" fill="#6500B5"/>
    <text x="0" y="-46" text-anchor="middle" fill="#4B4D57" font-family="sans-serif" font-size="14" font-weight="600">N</text>
  </g>
</svg>
